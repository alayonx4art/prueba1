<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basurero del Caos 🗑️</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #222;
        }

        /* =========================
           FONDO ANIMADO
           ========================= */

        .fondo {
            position: fixed;
            inset: 0;
            z-index: -3;

            background-image:
                linear-gradient(
                    rgba(0, 0, 0, 0.35),
                    rgba(0, 0, 0, 0.55)
                ),
                url("basurero.gif");

            background-size: cover;
            background-position: center;

            animation: zoom 12s infinite alternate ease-in-out;
        }

        @keyframes zoom {
            from {
                transform: scale(1);
            }

            to {
                transform: scale(1.08);
            }
        }

        /* =========================
           CONTENIDO
           ========================= */

        .contenedor {
            height: 100vh;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            gap: 25px;

            text-align: center;
        }

        h1 {
            color: white;
            font-size: 55px;

            text-shadow:
                0 0 10px black,
                0 0 20px black;
        }

        #contador {
            color: white;
            font-size: 25px;
            font-weight: bold;

            text-shadow: 2px 2px 5px black;
        }

        /* =========================
           BOTÓN
           ========================= */

        button {
            padding: 20px 45px;

            font-size: 25px;
            font-weight: bold;

            border: none;
            border-radius: 15px;

            cursor: pointer;

            background: #75b843;
            color: white;

            box-shadow:
                0 5px 0 #3c7020,
                0 0 20px rgba(0,0,0,0.6);

            transition: 0.15s;
        }

        button:hover {
            transform: scale(1.08);
        }

        button:active {
            transform: translateY(5px);
            box-shadow:
                0 0 0 #3c7020;
        }

        /* =========================
           BASURA
           ========================= */

        .basura {
            position: fixed;

            font-size: 40px;

            pointer-events: none;

            animation: aparecer 0.5s ease-out forwards;
        }

        @keyframes aparecer {

            0% {
                opacity: 0;
                transform:
                    translateY(30px)
                    rotate(0deg)
                    scale(0);
            }

            100% {
                opacity: 1;
                transform:
                    translateY(0)
                    rotate(360deg)
                    scale(1);
            }
        }

        /* =========================
           NPC
           ========================= */

        .npc {
            position: fixed;

            font-size: 50px;

            animation:
                caminar 4s linear forwards;

            pointer-events: none;
        }

        @keyframes caminar {

            from {
                transform: translateX(-100px);
            }

            to {
                transform: translateX(110vw);
            }
        }

        /* =========================
           MENSAJE FINAL
           ========================= */

        #mensajeFinal {
            display: none;

            position: fixed;
            inset: 0;

            z-index: 100;

            justify-content: center;
            align-items: center;

            text-align: center;

            background:
                rgba(0, 0, 0, 0.75);

            animation: entrada 0.5s ease;
        }

        #mensajeFinal h2 {
            color: white;

            font-size: clamp(60px, 12vw, 180px);

            font-weight: 900;

            text-transform: uppercase;

            text-shadow:
                0 0 10px red,
                0 0 30px red,
                0 0 60px red;

            animation:
                temblar 0.12s infinite alternate;
        }

        @keyframes entrada {

            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes temblar {

            from {
                transform: rotate(-2deg) scale(1);
            }

            to {
                transform: rotate(2deg) scale(1.04);
            }
        }

        /* Oscurecimiento progresivo */

        .caos {
            position: fixed;
            inset: 0;

            pointer-events: none;

            background: rgba(80, 0, 0, 0);

            transition: 1s;
        }

    </style>
</head>

<body>

    <!-- Fondo -->
    <div class="fondo"></div>

    <!-- Capa que se vuelve más oscura con el caos -->
    <div class="caos" id="caos"></div>


    <main class="contenedor">

        <h1>🗑️ BASURERO DEL CAOS 🗑️</h1>

        <div id="contador">
            Basura generada: 0
        </div>

        <button onclick="generarCaos()">
            🗑️ GENERAR BASURA
        </button>

    </main>


    <!-- Mensaje final -->

    <div id="mensajeFinal">
        <h2>
            DIEGO<br>
            VIENE POR TI
        </h2>
    </div>


    <script>

        let basura = 0;

        // Diferentes objetos que pueden aparecer

        const basuraTipos = [
            "🗑️",
            "🛢️",
            "📦",
            "🥫",
            "🍾",
            "🧴",
            "🛍️",
            "🧻",
            "🍌",
            "💩"
        ];

        // Personajes ficticios / NPCs

        const npcTipos = [
            "🧍",
            "🚶",
            "🧑‍🦯",
            "👨‍🦱"
        ];


        function generarCaos() {

            basura++;

            // Actualizar contador

            document.getElementById("contador").textContent =
                "Basura generada: " + basura;


            // Crear basura

            for (let i = 0; i < 3; i++) {

                const objeto =
                    document.createElement("div");

                objeto.className = "basura";

                objeto.textContent =
                    basuraTipos[
                        Math.floor(
                            Math.random() *
                            basuraTipos.length
                        )
                    ];

                objeto.style.left =
                    Math.random() * 95 + "vw";

                objeto.style.top =
                    55 + Math.random() * 40 + "vh";

                document.body.appendChild(objeto);

            }


            // Cada 3 clics aparece un NPC ficticio

            if (basura % 3 === 0) {

                const npc =
                    document.createElement("div");

                npc.className = "npc";

                npc.textContent =
                    npcTipos[
                        Math.floor(
                            Math.random() *
                            npcTipos.length
                        )
                    ];

                npc.style.top =
                    50 + Math.random() * 40 + "vh";

                npc.style.left = "-80px";

                document.body.appendChild(npc);

                setTimeout(() => {
                    npc.remove();
                }, 4500);
            }


            // Aumentar progresivamente el caos

            const intensidad =
                Math.min(basura / 50, 0.5);

            document.getElementById("caos")
                .style.background =
                `rgba(80, 0, 0, ${intensidad})`;


            // =========================
            // FINAL
            // =========================

            if (basura >= 20) {

                document.getElementById("mensajeFinal")
                    .style.display = "flex";

            }

        }

    </script>

</body>
</html>
