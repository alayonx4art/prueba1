
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caos Académico 📚</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #222;
        }

        /* FONDO ANIMADO */

        .fondo {
            position: fixed;
            inset: 0;
            z-index: -3;

            background-image:
                linear-gradient(
                    rgba(0, 0, 0, 0.35),
                    rgba(0, 0, 0, 0.55)
                ),
                url("basurero.gif");

            background-size: cover;
            background-position: center;

            animation: zoom 12s infinite alternate ease-in-out;
        }

        @keyframes zoom {
            from { transform: scale(1); }
            to { transform: scale(1.08); }
        }

        /* CONTENIDO */

        .contenedor {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 25px;
            text-align: center;
            padding: 20px;
        }

        h1 {
            color: white;
            font-size: clamp(30px, 5vw, 55px);
            text-shadow: 0 0 10px black, 0 0 20px black;
        }

        #contador {
            color: white;
            font-size: 25px;
            font-weight: bold;
            text-shadow: 2px 2px 5px black;
        }

        /* BOTÓN */

        button {
            padding: 20px 45px;
            font-size: 25px;
            font-weight: bold;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            background: #75b843;
            color: white;

            box-shadow:
                0 5px 0 #3c7020,
                0 0 20px rgba(0,0,0,0.6);

            transition: 0.15s;
        }

        button:hover {
            transform: scale(1.08);
        }

        button:active {
            transform: translateY(5px);
            box-shadow: 0 0 0 #3c7020;
        }

        /* LIBROS Y STICKERS */

        .libro {
            position: fixed;
            font-size: 40px;
            pointer-events: none;
            animation: aparecer 0.5s ease-out forwards;
        }

        @keyframes aparecer {
            0% {
                opacity: 0;
                transform: translateY(30px) rotate(0deg) scale(0);
            }

            100% {
                opacity: 1;
                transform: translateY(0) rotate(360deg) scale(1);
            }
        }

        /* ALARMAS */

        .alarma {
            position: fixed;
            font-size: 50px;
            pointer-events: none;
            animation: caminar 4s linear forwards;
        }

        @keyframes caminar {
            from { transform: translateX(-100px); }
            to { transform: translateX(110vw); }
        }

        /* MENSAJE FINAL */

        #mensajeFinal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 100;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 30px;
            text-align: center;
            background: rgba(0, 0, 0, 0.85);
            padding: 20px;
        }

        #mensajeFinal h2 {
            color: white;
            font-size: clamp(35px, 8vw, 100px);
            font-weight: 900;
            text-shadow:
                0 0 10px red,
                0 0 30px red,
                0 0 60px red;

            animation: temblar 0.12s infinite alternate;
        }

        #cuentaRegresiva {
            color: yellow;
            font-size: clamp(80px, 15vw, 160px);
            font-weight: 900;
            text-shadow: 0 0 30px orange;
        }

        #resultado {
            display: none;
            color: red;
            font-size: clamp(50px, 12vw, 150px);
            font-weight: 900;
            text-shadow: 0 0 30px red;
            animation: temblar 0.12s infinite alternate;
        }

        @keyframes temblar {
            from { transform: rotate(-2deg) scale(1); }
            to { transform: rotate(2deg) scale(1.04); }
        }

        /* OSCURECIMIENTO */

        .caos {
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: rgba(80, 0, 0, 0);
            transition: 1s;
        }

    </style>
</head>

<body>

    <div class="fondo"></div>
    <div class="caos" id="caos"></div>

    <main class="contenedor">

        <h1>📚 CAOS ACADÉMICO 📚</h1>

        <div id="contador">
            Intentos de estudio: 0 / 15
        </div>

        <button id="boton" onclick="generarCaos()">
            📚 ¡ESTUDIAR!
        </button>

    </main>

    <!-- MENSAJE FINAL -->

    <div id="mensajeFinal">

        <h2>🚨 EYDENN<br>¡LA ALARMA SUENA! 🚨</h2>

        <div id="cuentaRegresiva"></div>

        <div id="resultado">
            NO VA A IR.
        </div>

    </div>

    <script>

        let intentos = 0;
        let terminado = false;

        // Objetos de estudio

        const objetosEstudio = [
            "📚",
            "📖",
            "📕",
            "📗",
            "📘",
            "📙",
            "📓",
            "📒",
            "✏️",
            "🖊️",
            "📐",
            "📏",
            "📝",
            "📎",
            "⭐",
            "💡",
            "🎓"
        ];

        // Alarmas y personajes

        const alarmas = [
            "⏰",
            "🚨",
            "🔔",
            "📢",
            "⏱️"
        ];

        function generarCaos() {

            if (terminado) return;

            intentos++;

            document.getElementById("contador").textContent =
                "Intentos de estudio: " + intentos + " / 15";

            // Generar libros y stickers

            for (let i = 0; i < 3; i++) {

                const objeto = document.createElement("div");

                objeto.className = "libro";

                objeto.textContent =
                    objetosEstudio[
                        Math.floor(Math.random() * objetosEstudio.length)
                    ];

                objeto.style.left = Math.random() * 95 + "vw";
                objeto.style.top = 55 + Math.random() * 40 + "vh";

                document.body.appendChild(objeto);

            }

            // Cada 3 intentos aparece una alarma

            if (intentos % 3 === 0) {

                const alarma = document.createElement("div");

                alarma.className = "alarma";

                alarma.textContent =
                    alarmas[Math.floor(Math.random() * alarmas.length)];

                alarma.style.top = 50 + Math.random() * 40 + "vh";
                alarma.style.left = "-80px";

                document.body.appendChild(alarma);

                setTimeout(() => {
                    alarma.remove();
                }, 4500);
            }

            // Aumentar el caos

            const intensidad = Math.min(intentos / 30, 0.5);

            document.getElementById("caos").style.background =
                `rgba(80, 0, 0, ${intensidad})`;

            // FINAL DESPUÉS DE 15 INTENTOS

            if (intentos >= 15) {

                terminado = true;

                document.getElementById("boton").disabled = true;

                document.getElementById("mensajeFinal").style.display = "flex";

                iniciarCuentaRegresiva();
            }

        }

        // CUENTA REGRESIVA

        function iniciarCuentaRegresiva() {

            const cuenta = document.getElementById("cuentaRegresiva");

            const resultado = document.getElementById("resultado");

            let numero = 3;

            cuenta.textContent = numero;

            const intervalo = setInterval(() => {

                numero--;

                if (numero > 0) {

                    cuenta.textContent = numero;

                } else {

                    clearInterval(intervalo);

                    cuenta.style.display = "none";

                    resultado.style.display = "block";

                }

            }, 1000);

        }

    </script>

</body>
</html>


    </script>

</body>
</html>
